name: Build Android APK + AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VITE_API_BASE_URL: https://gfd-backend.onrender.com/api/v1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── 1. Checkout ──
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java 17 (required by AGP 8.x) ──
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Node 22 ──
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ── 4. Install JS deps ──
      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      # ── 5. Build Vite production bundle ──
      - name: Build Vite
        run: npm run build

      # ── 6. Sync Capacitor → Android ──
      - name: Capacitor sync
        run: npx cap sync android

      # ── 7. Accept Android SDK licenses + install platform-35 ──
      - name: Setup Android SDK
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" || true

      # ── 8. Write local.properties ──
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      # ── 9. Cache Gradle ──
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── 10. Make gradlew executable ──
      - name: chmod gradlew
        run: chmod +x android/gradlew

      # ── 11. Decode keystore for signed release (optional — only runs if secret set) ──
      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # ── 12. Build Debug APK ──
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # ── 13. Build Release AAB (for Google Play) ──
      - name: Build Release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_BASE64:   ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}

      # ── 14. Upload Debug APK ──
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GFD-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 15. Upload Release AAB (Google Play) ──
      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: GFD-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
