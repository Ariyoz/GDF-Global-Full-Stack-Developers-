name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci --legacy-peer-deps --prefer-offline

      - name: Build Vite
        run: npm run build
        env:
          VITE_API_BASE_URL: https://gfd-backend.onrender.com/api/v1

      - name: Capacitor sync
        run: npx cap sync android

      - name: Show Android SDK info
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_SDK_ROOT/cmdline-tools/ || echo "no cmdline-tools"
          ls $ANDROID_SDK_ROOT/platforms/ || echo "no platforms"

      - name: Install Android platform 35
        run: |
          SDKMANAGER=""
          if [ -f "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -f "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          else
            SDKMANAGER=$(find $ANDROID_SDK_ROOT -name sdkmanager 2>/dev/null | head -1)
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GFD-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
