<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ── Favicons & Icons ── -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/touch-icon.png" />
    <meta name="msapplication-TileImage" content="/touch-icon.png" />
    <meta name="msapplication-TileColor" content="#630ed4" />
    <meta name="theme-color" content="#630ed4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary SEO ── -->
    <title>GFD | Global Full-Stack Developers — Hire Top Dev Talent</title>
    <meta name="description" content="GFD (Global Full-Stack Developers) is the premier platform to hire world-class full-stack developers, post freelance projects, and find software engineering jobs. Better than Fiverr or Upwork — built for serious developers." />
    <meta name="keywords" content="hire developers, freelance developers, full-stack developers, software engineers for hire, hire programmers, developer marketplace, freelance platform, web developers, find developers, software jobs, developer community, fiverr alternative, upwork alternative, global developers" />
    <meta name="author" content="Global Full-Stack Developers" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://www.globalfd.xyz/" />

    <!-- ── Open Graph / Facebook ── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GFD — Global Full-Stack Developers" />
    <meta property="og:title" content="GFD | Hire World-Class Full-Stack Developers" />
    <meta property="og:description" content="Find and hire elite full-stack developers for your projects. Post freelance gigs, browse developer profiles, and build your software team — all in one place." />
    <meta property="og:url" content="https://www.globalfd.xyz/" />
    <meta property="og:image" content="https://www.globalfd.xyz/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GFD — Global Full-Stack Developers Platform" />
    <meta property="og:locale" content="en_US" />

    <!-- ── Twitter Card ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@globalfd_xyz" />
    <meta name="twitter:title" content="GFD | Hire World-Class Full-Stack Developers" />
    <meta name="twitter:description" content="Find and hire elite full-stack developers for your projects. Post freelance gigs, browse developer profiles, and build your software team." />
    <meta name="twitter:image" content="https://www.globalfd.xyz/og-image.png" />

    <!-- ── Schema.org Structured Data — Website + Organization ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://www.globalfd.xyz/#website",
          "url": "https://www.globalfd.xyz/",
          "name": "GFD — Global Full-Stack Developers",
          "description": "The premier developer marketplace to hire world-class full-stack engineers, post software projects, and find engineering jobs.",
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://www.globalfd.xyz/explore?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://www.globalfd.xyz/#organization",
          "name": "Global Full-Stack Developers",
          "alternateName": "GFD",
          "url": "https://www.globalfd.xyz/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://www.globalfd.xyz/favicon.png"
          },
          "description": "GFD is a global developer community and marketplace connecting world-class full-stack engineers with clients who need high-impact software built.",
          "sameAs": []
        },
        {
          "@type": "WebPage",
          "@id": "https://www.globalfd.xyz/#webpage",
          "url": "https://www.globalfd.xyz/",
          "name": "GFD | Hire World-Class Full-Stack Developers",
          "isPartOf": { "@id": "https://www.globalfd.xyz/#website" },
          "about": { "@id": "https://www.globalfd.xyz/#organization" },
          "description": "Find and hire elite full-stack developers for your projects. Post freelance gigs, browse developer profiles, and build your software team — all in one place."
        }
      ]
    }
    </script>

    <!-- ── Fonts — preload for instant rendering ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preconnect to backend API — eliminates DNS lookup delay on first request -->
    <link rel="preconnect" href="https://gfd-backend.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://gfd-backend.onrender.com" />
    <!-- Preconnect to Cloudinary for fast image/video loading -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <!-- Material Symbols (icons) — must load before anything else -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" /></noscript>
    <!-- Text fonts — swap so text renders immediately -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
      // Unregister any old service workers that might be causing blank pages
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
          }
        });
      }
    </script>
  </body>
</html>
