<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GFD — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0520;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 2rem;
      text-align: center;
    }
    .offline-card {
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }
    .offline-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(124, 58, 237, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }
    h1 { font-size: 1.5rem; font-weight: 700; }
    p { font-size: 0.9rem; color: rgba(255,255,255,0.7); line-height: 1.6; }
    .retry-btn {
      margin-top: 1rem;
      padding: 0.75rem 2rem;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .retry-btn:hover { background: #6d28d9; }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon">📡</div>
    <h1>You're Offline</h1>
    <p>Check your internet connection and try again. GFD needs a network connection to load new content.</p>
    <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
